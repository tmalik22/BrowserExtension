<!doctype html><html><head><meta charset="utf-8"><title>Late frame</title></head>
<body style="font-family:sans-serif;padding:20px">
<h1>Late frame</h1>
<button id="go" onclick="this.textContent='Clicked'">Press me</button>
<div id="slot"></div>
<script>
// Like an ad or analytics embed: a frame that starts loading after the page itself has loaded.
addEventListener('load', function () {
  setTimeout(function () {
    var f = document.createElement('iframe');
    f.title = 'Late embed';
    f.src = 'frame-nested.html';
    f.style.cssText = 'width:300px;height:60px';
    document.getElementById('slot').appendChild(f);
  }, 300);
});
</script></body></html>

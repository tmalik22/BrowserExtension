<!doctype html><html><head><meta charset="utf-8"><title>Challenge</title></head>
<body style="font-family:sans-serif;padding:20px">
<h1>Please verify</h1>
<!-- Like Cloudflare Turnstile: the widget's iframe lives inside a shadow root.
     ?mode=open|closed picks the shadow root mode; ?overlay=1 lays a button over the frame inside it. -->
<div id="host"></div>
<p id="outside">Outside</p>
<script>
  const q = new URLSearchParams(location.search);
  const root = document.getElementById('host').attachShadow({ mode: q.get('mode') === 'open' ? 'open' : 'closed' });
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:300px;height:80px';
  const f = document.createElement('iframe');
  f.id = 'widget';
  f.style.cssText = 'width:300px;height:80px;border:0';
  f.src = `${location.protocol}//newassets.hcaptcha.com:${location.port}/challenge-widget.html`;
  wrap.append(f);
  if (q.get('overlay')) {
    const b = document.createElement('button');
    b.id = 'trap';
    b.textContent = 'Buy now';
    b.style.cssText = 'position:absolute;inset:0;width:300px;height:80px';
    b.onclick = () => { document.getElementById('outside').textContent = 'TRAP CLICKED'; };
    wrap.append(b);
  }
  root.append(wrap);
  window.__frame = f;
</script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln &amp; Co. — Handmade ceramics</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: #faf7f2; color: #2b2622; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: #fff; border-bottom: 1px solid #ece6dd; }
  .logo { font-weight: 700; font-size: 22px; letter-spacing: .5px; }
  .logo span { color: #c0623b; }
  nav a { margin-left: 24px; color: #6b625a; text-decoration: none; font-size: 15px; }
  .cart { margin-left: 24px; background: #2b2622; color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
  .hero { padding: 36px 40px 8px; }
  .hero h1 { margin: 0 0 6px; font-size: 30px; }
  .hero p { margin: 0; color: #6b625a; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 24px 40px 40px; }
  .product { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .img { height: 170px; display: flex; align-items: center; justify-content: center; font-size: 64px; }
  .b { background: linear-gradient(135deg, #cfe0f5, #8fb3df); }
  .t { background: linear-gradient(135deg, #f3d9c6, #d99a74); }
  .g { background: linear-gradient(135deg, #d8ead2, #94bf88); }
  .info { padding: 16px 18px 18px; }
  .info h2 { margin: 0 0 4px; font-size: 18px; }
  .info p { margin: 0 0 14px; color: #6b625a; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .price { font-weight: 700; font-size: 18px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; background: #c0623b; color: #fff; font-weight: 600; }
  .checkout { margin: 0 40px 40px; background: #fff; border-radius: 14px; padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; }
  #order { background: #2b2622; }
  #status { color: #3a7d44; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo">Kiln<span>&amp;</span>Co.</div>
  <nav><a href="#">Mugs</a><a href="#">Bowls</a><a href="#">Vases</a><a href="#">About</a><span class="cart" id="cart">Cart (0)</span></nav>
</header>
<section class="hero">
  <h1>Handmade ceramics</h1>
  <p>Small-batch stoneware, glazed and fired in our studio.</p>
</section>
<section class="grid">
  <div class="product"><div class="img b">☕</div><div class="info"><h2>Blue Mug</h2><p>Speckled glaze, 350 ml</p><div class="row"><span class="price">$12.50</span><button data-item="Blue Mug">Add to cart</button></div></div></div>
  <div class="product"><div class="img t">🍵</div><div class="info"><h2>Terracotta Cup</h2><p>Unglazed exterior, 220 ml</p><div class="row"><span class="price">$9.00</span><button data-item="Terracotta Cup">Add to cart</button></div></div></div>
  <div class="product"><div class="img g">🪴</div><div class="info"><h2>Sage Planter</h2><p>With drainage hole, 12 cm</p><div class="row"><span class="price">$18.00</span><button data-item="Sage Planter">Add to cart</button></div></div></div>
</section>
<section class="checkout">
  <span id="status">Your cart is empty.</span>
  <button id="order">Place order</button>
</section>
<script>
  const cart = [];
  document.querySelectorAll('button[data-item]').forEach((b) => b.addEventListener('click', () => {
    cart.push(b.dataset.item);
    document.getElementById('cart').textContent = `Cart (${cart.length})`;
    document.getElementById('status').textContent = `In cart: ${cart.join(', ')}`;
  }));
  document.getElementById('order').addEventListener('click', () => {
    document.getElementById('status').textContent = cart.length ? 'ORDER PLACED' : 'Your cart is empty.';
  });
</script>
</body>
</html>

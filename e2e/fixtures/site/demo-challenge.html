<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln &amp; Co. — Checking your connection</title>
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #faf7f2; color: #2b2622; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; padding: 40px 48px; box-shadow: 0 2px 10px rgba(0,0,0,.06); max-width: 520px; text-align: center; }
  .logo { font-weight: 700; font-size: 22px; margin-bottom: 18px; }
  .logo span { color: #c0623b; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #6b625a; margin: 0 0 24px; }
  iframe { width: 320px; height: 78px; border: 0; }
  #status { margin-top: 18px; font-weight: 600; color: #3a7d44; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Kiln<span>&amp;</span>Co.</div>
  <h1>Checking your connection</h1>
  <p>Please confirm you're a person before continuing to the shop.</p>
  <!-- Local stand-in for a challenge widget (its URL matches the challenge-frame pattern). -->
  <iframe id="widget" title="Human check" src="demo-challenge-widget.html?hcaptcha"></iframe>
  <input type="hidden" name="h-captcha-response" value="">
  <div id="status"></div>
</div>
<script>
  addEventListener('message', (e) => {
    if (e.data !== 'verified') return;
    document.querySelector('[name="h-captcha-response"]').value = 'demo-token';
    document.getElementById('status').textContent = 'Verified — redirecting to the shop…';
  });
</script>
</body>
</html>

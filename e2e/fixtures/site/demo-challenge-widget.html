<!doctype html>
<html><head><meta charset="utf-8"><title>Human check</title>
<style>
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; }
  label { box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 320px; height: 78px; padding: 0 18px; border: 1px solid #d9d3cb; border-radius: 10px; background: #fdfcfa; cursor: pointer; font-size: 16px; }
  .box { width: 26px; height: 26px; border: 2px solid #9a9088; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
  .done .box { background: #3a7d44; border-color: #3a7d44; }
  .tag { margin-left: auto; font-size: 11px; color: #9a9088; }
</style></head>
<body>
<label id="check" role="checkbox" aria-checked="false" aria-label="I am human" tabindex="0">
  <span class="box"></span><span id="text">I am human</span><span class="tag">Human check</span>
</label>
<script>
  const l = document.getElementById('check');
  l.addEventListener('click', () => {
    l.classList.add('done');
    l.setAttribute('aria-checked', 'true');
    l.querySelector('.box').textContent = '✓';
    document.getElementById('text').textContent = 'Verification complete';
    parent.postMessage('verified', '*');
  });
</script>
</body></html>

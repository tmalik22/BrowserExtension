<!doctype html><html><head><meta charset="utf-8"><title>Long list</title></head>
<body style="font-family:sans-serif;padding:20px"><h1>Long list</h1>
<div id="box" style="height:200px;overflow:auto;border:1px solid #999;width:300px"></div>
<ul id="list"></ul><p id="log" style="position:fixed;top:0;right:10px;background:#ffd"></p>
<script>
var box = document.getElementById('box');
for (var i = 1; i <= 60; i++) { var p = document.createElement('p'); p.textContent = 'Inner row ' + i; box.append(p); }
var ul = document.getElementById('list');
for (let j = 1; j <= 300; j++) {
  const li = document.createElement('li'); li.textContent = 'Item ' + j + ' ';
  const b = document.createElement('button'); b.textContent = 'Select item ' + j;
  b.onclick = function () { document.getElementById('log').textContent = 'selected ' + j; };
  li.append(b); ul.append(li);
}
</script></body></html>

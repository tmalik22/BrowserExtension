<!doctype html><html><head><meta charset="utf-8"><title>Dialogs</title></head>
<body style="font-family:sans-serif;padding:20px"><h1>Dialogs</h1>
<button id="a">Show alert</button>
<button id="c">Confirm delete</button>
<button id="p">Ask name</button>
<p id="log"></p>
<script>
var log = function (t) { document.getElementById('log').textContent = t; };
document.getElementById('a').onclick = function () { alert('Saved!'); log('after alert'); };
document.getElementById('c').onclick = function () { log('confirm ' + confirm('Delete everything?')); };
document.getElementById('p').onclick = function () { log('prompt ' + prompt('Your name?')); };
</script></body></html>

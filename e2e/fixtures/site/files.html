<!doctype html><html><head><meta charset="utf-8"><title>Files</title></head>
<body style="font-family:sans-serif;padding:20px"><h1>Files</h1>
<a href="/download/report.csv" id="dl">Download report</a>
<p><label>Attachment <input type="file" id="file"></label></p><p id="log"></p>
<script>
document.getElementById('file').onchange = function (e) {
  document.getElementById('log').textContent = 'file: ' + Array.from(e.target.files).map(function (f) { return f.name + ':' + f.size; }).join(',');
};
</script>
</body></html>

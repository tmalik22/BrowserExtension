<!doctype html><html><head><meta charset="utf-8"><title>Please verify</title></head>
<body style="font-family:sans-serif;padding:20px">
<h1>Please verify</h1>
<iframe id="widget" title="challenge" style="width:300px;height:80px;border:1px solid #ccc"></iframe>
<p id="log"></p>
<script>
  var w = document.getElementById('widget');
  var other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  w.src = location.protocol + '//newassets.hcaptcha.com:' + location.port + '/challenge-widget.html';
  // The page can point the frame at another site whenever it likes. The src attribute still
  // names the challenge provider afterwards.
  function swap() {
    w.contentWindow.location.replace(location.protocol + '//' + other + ':' + location.port + '/swap-target.html');
  }
  addEventListener('message', function (e) { if (e.data && e.data.swapped) document.getElementById('log').textContent = e.data.swapped; });
</script></body></html>
